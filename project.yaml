id: 29
name: load-test-suite
program:
  id: delivery-observability-infra
  narrative_fit: Proves a reusable load layer that compares the p95 of an HTTP target under controlled VU levels.
  shared_assets:
    - k6 load profiles
    - benchmark result schema
    - Docker and CI validation
status: published
claim: A Dockerized suite measures a reproducible p95 curve of a local HTTP target under 1, 5, 10, and 20 VUs.
stack: [go, k6, javascript, docker]
language_profile:
  primary: go-backend
  secondary: [javascript]
  reason: Go provides a static, low-overhead HTTP target; JavaScript is the native language of k6 scenarios.
decision_brain:
  agentic_spec:
    source: .portfolio/decision-brain/agentic-spec-governance.yaml
    spec_store: portfolio-reuse-kit
    schema: portfolio-system
    project_config: openspec/config.yaml
    component_pack: delivery-observability-infra
    artifact_graph:
      - intent->portfolio-impact->architecture-record
      - architecture-record+portfolio-impact->component-pack
      - component-pack->reuse-delta->benchmark-proof->tasks->verification
  agent_graph:
    mode: principal-agent-orchestrated
    source: .portfolio/decision-brain/agent-graph.yaml
    handoff: sdd/agent-handoff.md
    local_first_runtime: docker
  reuse_improvement_loop:
    source: .portfolio/decision-brain/reuse-improvement-loop.yaml
    review_path: sdd/reuse-improvement-review.md
    current_status: applied
  principles:
    coupling_rule: The target module depends only on the standard library; the scenario and the report do not import the target.
    solid: [srp, ocp, lsp, isp, dip]
    simplicity_rule: One HTTP binary, one k6 profile, and one JSON report are enough to prove the claim.
    testability_rule: The Go handler is tested with httptest without Docker; the scenario contract is validated in the build and by k6.
    rejected_overengineering:
      - Microservices and a broker, because the benchmark measures local synchronous HTTP.
      - A Go HTTP framework, because net/http covers the target without a dependency cost.
  stack_profile: go-backend
  api_style: rest-http
  messaging: none
  cloud:
    mode: none
    local_provider: none
    real_provider_target: none
    emulated_services: []
    adapter_rule: There is no cloud dependency; a remote target can be supplied through TARGET_URL without changing the scenario.
    config_switch: TARGET_URL=http://127.0.0.1:8080/work
    unsupported_behaviors: []
  database: none
  runtime: Go 1.26.8 target and k6 2.2.0 security rebuild; historical benchmark evidence predates this runtime.
  library_policy: Use only net/http in the target and the native k6 APIs; no application dependency is needed.
  record_path: sdd/technical-decision.md
  rejected_options:
    - option: Python HTTP server
      reason: It would add a runtime and an interpreter dependency to the target without increasing the signal.
    - option: Node.js HTTP server
      reason: The target must stay minimal, and k6 already covers the JavaScript side of the tool.
architecture:
  style: modular-monolith
  reason: The repository has three cohesive modules (target, scenario, and report) with one Docker path and no artificial distributed cost.
  problem_forces:
    domain_complexity: low
    integration_pressure: medium
    ui_state_complexity: none
    data_or_ml_reproducibility: high
    auditability: low
    throughput_or_async: medium
    independent_deployability: low
  dependency_rule: The Go target knows neither k6 nor the report; the scenario knows only the HTTP contract; the report consumes k6 metrics.
  boundaries:
    - internal/target: minimal HTTP contract and handler.
    - k6/scenarios: VU levels, durations, and requests.
    - k6/report: turns the k6 summary into a versioned result.
    - scripts: Docker execution adapters for PowerShell and POSIX.
  rejected_alternatives:
    - style: hexagonal
      reason: It would add ports with no real integrations to swap; the module boundaries already isolate the target and the benchmark.
    - style: microservices
      reason: A second application process would increase variance and the complexity of the local path.
design_system:
  tokens: .portfolio/design-system/tokens.yaml
  readme_components:
    - readme_header
    - benchmark_card
    - architecture_card
    - references_table
  diagram_required: true
reuse:
  kit_version: local
  uses:
    - catalog
    - programs
    - proficiency-map
    - component-packs
    - openspec-schema
    - decision-brain
    - agent-graph
    - reuse-improvement-loop
    - architecture
    - language-profiles
    - design-system
    - sdd
    - harness
    - templates
    - skills
benchmark:
  primary_metric: p95_ms_at_max_vus
  unit: ms
  command: "pwsh -NoProfile -File scripts/publish-benchmark.ps1 -Build"
  result_path: benchmarks/results/29-p95-curve-v1.json
  publication_result_path: benchmarks/publication/29-p95-curve-v2.json
release:
  docker: "docker build -t load-test-suite:local ."
  no_secret_default_path: true
  readme_has_number: true
  references_documented: true
schema: portfolio-system
references:
  - portfolio-reuse-kit
context: |
  Project: load-test-suite (#29)
  Source of truth:
    - Use `.portfolio/` as the local snapshot of portfolio-reuse-kit.
    - Use `project.yaml` for the public project contract.
    - Use `sdd/` for lightweight artifacts that must exist even without OpenSpec installed.
  Core rules:
    - Prove one measurable claim.
    - Select one component pack from `.portfolio/component-packs/manifest.yaml`.
    - Record architecture, stack, API, messaging, cloud, database/runtime, and library choices with rejected alternatives.
    - Keep target and benchmark boundaries explicit.
    - Prefer local-first execution and no paid secret.
    - Resolve reuse improvements as patch-now, backlog, or reject.
rules:
  reference-reuse:
    - Prioritize local skills and `.portfolio/`; use external repositories only as attributed references.
  intent:
    - Keep the claim measurable and README-ready.
  portfolio-impact:
    - Explain how this repo strengthens the delivery and observability program.
  architecture-record:
    - Include SOLID, LSP, KISS, YAGNI, dependency inversion, and testability evidence.
  component-pack:
    - Select from `.portfolio/component-packs/manifest.yaml`.
  reuse-delta:
    - Record whether the kit improved because of this project.
  benchmark-proof:
    - Include metric, unit, command, fixture, JSON path, and README result.
  verification:
    - Verify Docker, tests, benchmark JSON, README, references, reuse review, and validation.
